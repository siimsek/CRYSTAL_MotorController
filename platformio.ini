[platformio]
default_envs = motor_kontrol
src_dir = src
include_dir = include
boards_dir = boards

[env:motor_kontrol]
platform = ststm32
board = motor_kontrol_f030c8
framework = stm32cube
upload_protocol = stlink
debug_tool = stlink
board_build.f_cpu = 48000000L
lib_deps =
    olikraus/U8g2@2.36.18
lib_ldf_mode = deep+
build_flags =
    -DSTM32F030x8
    -DUSE_HAL_DRIVER
    -Os
    -ffunction-sections
    -fdata-sections
    -Wall
    -Wextra
    # STM32Cube HAL kaynaklari bazi API imzalarinda kullanilmayan parametre
    # tasir; proje kaynaklari host testlerinde -Werror ile denetlenir.
    -Wno-unused-parameter
build_unflags = -O0 -Og -O1 -O2 -O3
